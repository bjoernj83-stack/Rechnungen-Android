<!doctype html><html lang='de'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>Rechnungen</title><meta name='theme-color' content='#17212b'><meta name='mobile-web-app-capable' content='yes'><meta name='apple-mobile-web-app-capable' content='yes'><meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#18202a;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}.app{max-width:620px;margin:auto;min-height:100vh;background:#f4f6f8}.top{background:#17212b;color:#fff;padding:22px 18px 18px;position:sticky;top:0}.top h1{font-size:21px;margin:0}.top small{opacity:.75}.page{padding:16px 16px 90px}.card{background:#fff;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 1px 4px #00000012}.btn{border:0;border-radius:13px;padding:14px 16px;font-weight:700;font-size:16px;width:100%;background:#17212b;color:#fff;margin:5px 0}.btn.alt{background:#e9edf1;color:#17212b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:#fff;border:0;border-radius:16px;padding:22px 10px;font-weight:700;font-size:15px;box-shadow:0 1px 4px #00000012}.tile b{display:block;font-size:27px;margin-bottom:6px}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}input,select,textarea{width:100%;border:1px solid #d5dbe1;border-radius:11px;padding:12px;font-size:16px;background:#fff}.row{display:grid;grid-template-columns:1fr 90px;gap:8px}.pos{border-bottom:1px solid #eee;padding:10px 0}.total{font-size:24px;font-weight:800;text-align:right;margin:14px 0}.muted{color:#66717c;font-size:13px}.hidden{display:none}.invoice{background:white;color:#111;padding:18px;border-radius:8px}.invoice h2{margin-bottom:2px}.invrow{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:7px 0}.badge{font-size:12px;padding:4px 8px;border-radius:99px;background:#fff1c7}.bottom{position:fixed;bottom:0;left:0;right:0;max-width:620px;margin:auto;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(3,1fr);padding:8px}.bottom button{border:0;background:none;padding:8px;font-weight:700}.listitem{padding:12px 0;border-bottom:1px solid #eee}.right{float:right}.danger{color:#b42318}
@media print{.top,.bottom,.no-print{display:none!important}.page{padding:0}.card{box-shadow:none;margin:0;padding:0}.invoice{padding:0}}
</style></head><body><div class='app'><header class='top'><h1>Eine schrecklich nette Familie</h1><small>Rechnungsprogramm</small></header>
<main class='page'>
<section id='home'><button class='btn' onclick="show('new')">＋ Neue Rechnung</button><div class='grid' style='margin-top:10px'><button class='tile' onclick="show('invoices')"><b>🧾</b>Rechnungen</button><button class='tile' onclick="show('customers')"><b>👤</b>Kunden</button></div><div class='card' style='margin-top:12px'><b>Übersicht</b><p><span id='count'>0</span> Rechnungen gespeichert</p><p>Offener Betrag: <b id='openTotal'>0,00 €</b></p></div></section>
<section id='new' class='hidden'><div class='card'><h2>Neue Rechnung</h2><label>Kunde</label><input id='custName' placeholder='Name des Kunden'><label>Anschrift</label><textarea id='custAddress' rows='2' placeholder='Straße, PLZ Ort'></textarea><label>Rechnungsdatum</label><input id='date' type='date'><h3>Artikel</h3><div id='positions'></div><button class='btn alt' onclick='addPosition()'>＋ Artikel hinzufügen</button><label>Versand (€) – nur eintragen, wenn benötigt</label><input id='shipping' inputmode='decimal' value='0' oninput='calc()'><div class='total' id='total'>0,00 €</div><button class='btn' onclick='createInvoice()'>Rechnung erstellen</button></div></section>
<section id='invoices' class='hidden'><div class='card'><h2>Rechnungen</h2><div id='invoiceList'></div></div></section>
<section id='customers' class='hidden'><div class='card'><h2>Kunden</h2><p class='muted'>Kunden werden automatisch aus erstellten Rechnungen übernommen.</p><div id='customerList'></div></div></section>
<section id='preview' class='hidden'><div class='card no-print'><button class='btn' onclick='nativePrint()'>📄 PDF speichern / drucken</button><button class='btn alt' onclick='nativePrint()'>🖨️ Drucken</button><button class='btn alt' onclick="show('invoices')">Zurück</button></div><div class='invoice' id='invoicePreview'></div></section>
</main><nav class='bottom'><button onclick="show('home')">🏠<br>Start</button><button onclick="show('new')">➕<br>Neu</button><button onclick="show('invoices')">🧾<br>Rechnungen</button></nav></div>
<script>
const COMPANY={name:'Eine schrecklich nette Familie',owner:'Tamara Gökay',address:'Weidenstr. 11, 41836 Hückelhoven',phone:'015170223430',tax:'208/5042/3075',bank:'N26',iban:'DE26 1001 1001 2622 5009 49',paypal:'tamargo2202@gmail.com'};
let invoices=JSON.parse(localStorage.getItem('invoices')||'[]');
function eur(n){return Number(n||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'})}function show(id){document.querySelectorAll('main>section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='invoices')renderInvoices();if(id==='customers')renderCustomers();if(id==='home')dashboard()}
function addPosition(){let d=document.createElement('div');d.className='pos';d.innerHTML=`<input class='desc' placeholder='Artikel / Beschreibung'><div class='row'><input class='qty' type='number' min='1' value='1' oninput='calc()'><input class='price' inputmode='decimal' placeholder='Preis €' oninput='calc()'></div><button class='btn alt danger' onclick='this.parentElement.remove();calc()'>Entfernen</button>`;positions.appendChild(d);calc()}
function valNum(v){return parseFloat(String(v).replace(',','.'))||0}function calc(){let sum=0;document.querySelectorAll('.pos').forEach(p=>sum+=valNum(p.querySelector('.qty').value)*valNum(p.querySelector('.price').value));sum+=valNum(shipping.value);total.textContent=eur(sum);return sum}
function nextNo(){let y=new Date().getFullYear();let nums=invoices.filter(i=>i.no.startsWith(y+'-')).map(i=>+i.no.split('-')[1]);return y+'-'+String((Math.max(0,...nums)+1)).padStart(3,'0')}
function createInvoice(){let items=[...document.querySelectorAll('.pos')].map(p=>({desc:p.querySelector('.desc').value.trim(),qty:valNum(p.querySelector('.qty').value),price:valNum(p.querySelector('.price').value)})).filter(x=>x.desc&&x.qty);if(!custName.value.trim()||!items.length){alert('Bitte Kunde und mindestens einen Artikel eintragen.');return}let inv={no:nextNo(),date:date.value||new Date().toISOString().slice(0,10),customer:custName.value.trim(),address:custAddress.value.trim(),items,shipping:valNum(shipping.value),total:calc(),status:'Offen'};invoices.unshift(inv);localStorage.setItem('invoices',JSON.stringify(invoices));renderPreview(inv);show('preview');resetForm()}
function resetForm(){custName.value='';custAddress.value='';shipping.value='0';positions.innerHTML='';addPosition()}
function renderInvoices(){invoiceList.innerHTML=invoices.length?'':'<p class="muted">Noch keine Rechnungen.</p>';invoices.forEach((i,idx)=>{let d=document.createElement('div');d.className='listitem';d.innerHTML=`<b>${i.no}</b> <span class='badge'>${i.status}</span><span class='right'><b>${eur(i.total)}</b></span><br>${i.customer}<br><span class='muted'>${new Date(i.date+'T12:00').toLocaleDateString('de-DE')}</span> · <button onclick='openInv(${idx})'>Öffnen</button> · <button onclick='togglePaid(${idx})'>${i.status==='Bezahlt'?'Offen':'Bezahlt'}</button>`;invoiceList.appendChild(d)})}
function openInv(idx){renderPreview(invoices[idx]);show('preview')}function togglePaid(idx){invoices[idx].status=invoices[idx].status==='Bezahlt'?'Offen':'Bezahlt';localStorage.setItem('invoices',JSON.stringify(invoices));renderInvoices();dashboard()}
function renderCustomers(){let m=new Map();invoices.forEach(i=>m.set(i.customer,i.address));customerList.innerHTML=m.size?'':'<p class="muted">Noch keine Kunden.</p>';m.forEach((a,n)=>customerList.innerHTML+=`<div class='listitem'><b>${n}</b><br><span class='muted'>${a||''}</span></div>`)}

let currentPreviewInvoice=null;
function pdfEscape(s){return String(s??'').replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)').replace(/\r?\n/g,' ')}
function winAnsiBytes(str){let out=[];for(const ch of str){let c=ch.charCodeAt(0);if(c<=255)out.push(c);else{const map={'€':128,'–':150,'—':151,'‘':145,'’':146,'“':147,'”':148};out.push(map[ch]||63)}}return out}
function makePdf(inv){
 const lines=[]; const add=(t,size=11,bold=false,gap=16)=>lines.push({t:String(t),size,bold,gap});
 add(COMPANY.name,18,true,22); add(COMPANY.owner); add(COMPANY.address); add('Tel. '+COMPANY.phone,11,false,22);
 add('Rechnung '+inv.no,17,true,24); add('Rechnungsdatum: '+new Date(inv.date+'T12:00').toLocaleDateString('de-DE'),11,false,22);
 add('Rechnung an:',12,true); add(inv.customer); (inv.address||'').split(/\r?\n/).filter(Boolean).forEach(x=>add(x)); lines.push({t:'',size:8,gap:12});
 add('Positionen',14,true,22);
 inv.items.forEach(x=>{add(x.qty+' x '+x.desc,11,true);add(eur(x.price)+' je Stück     '+eur(x.qty*x.price),10,false,18)});
 if(inv.shipping){add('Versand     '+eur(inv.shipping),11,false,18)}
 add('Gesamt: '+eur(inv.total),15,true,28);
 add('Zahlungsmöglichkeiten',12,true); add(COMPANY.bank); add('IBAN: '+COMPANY.iban); add('PayPal: '+COMPANY.paypal,11,false,22);
 add('Hinweis PayPal:',11,true); add('Wer mit PayPal zahlt, bitte per Freunde oder bei',9); add('Warendienstleistung die Gebühren übernehmen.',9,false,20);
 add('Steuernummer: '+COMPANY.tax,9); add('Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.',9);
 let y=800, content='BT\n'; for(const l of lines){ if(y<55) break; content+=`/${l.bold?'F2':'F1'} ${l.size} Tf 50 ${y} Td (${pdfEscape(l.t)}) Tj\n`; y-=l.gap; content+='1 0 0 1 0 0 Tm\n'; } content+='ET';
 const enc=winAnsiBytes(content); const objs=[];
 objs.push('<< /Type /Catalog /Pages 2 0 R >>'); objs.push('<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
 objs.push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> /Contents 4 0 R >>');
 objs.push({stream:enc}); objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'); objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
 let bytes=[...new TextEncoder().encode('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n')], offsets=[0];
 const push=a=>bytes.push(...a), ascii=t=>new TextEncoder().encode(t);
 objs.forEach((o,i)=>{offsets.push(bytes.length);push(ascii(`${i+1} 0 obj\n`));if(typeof o==='string')push(ascii(o+'\n'));else{push(ascii(`<< /Length ${o.stream.length} >>\nstream\n`));push(o.stream);push(ascii('\nendstream\n'))}push(ascii('endobj\n'))});
 const xref=bytes.length;push(ascii(`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`));for(let i=1;i<offsets.length;i++)push(ascii(String(offsets[i]).padStart(10,'0')+' 00000 n \n'));push(ascii(`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`));
 return new Blob([new Uint8Array(bytes)],{type:'application/pdf'});
}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000)}
function savePdf(){if(!currentPreviewInvoice)return;try{downloadBlob(makePdf(currentPreviewInvoice),'Rechnung-'+currentPreviewInvoice.no+'.pdf')}catch(e){alert('PDF konnte nicht erstellt werden: '+e.message)}}
async function sharePdf(){if(!currentPreviewInvoice)return;try{const blob=makePdf(currentPreviewInvoice),file=new File([blob],'Rechnung-'+currentPreviewInvoice.no+'.pdf',{type:'application/pdf'});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){await navigator.share({title:'Rechnung '+currentPreviewInvoice.no,files:[file]})}else{downloadBlob(blob,file.name);alert('PDF wurde gespeichert. Öffne die PDF anschließend zum Drucken.')}}catch(e){if(e.name!=='AbortError')alert('Teilen/Drucken ist auf diesem Gerät nicht verfügbar. Bitte zuerst „PDF speichern“ verwenden.')}}


function nativePrint(){
  if(window.AndroidBridge && AndroidBridge.printPage){ AndroidBridge.printPage(); }
  else { window.print(); }
}

function renderPreview(i){currentPreviewInvoice=i;let itemHtml=i.items.map(x=>`<div class='invrow'><span>${x.qty} × ${x.desc}<br><small>${eur(x.price)} je Stück</small></span><b>${eur(x.qty*x.price)}</b></div>`).join('');let ship=i.shipping?`<div class='invrow'><span>Versand</span><b>${eur(i.shipping)}</b></div>`:'';invoicePreview.innerHTML=`<h2>${COMPANY.name}</h2><div>${COMPANY.owner}<br>${COMPANY.address}<br>Tel. ${COMPANY.phone}</div><hr><h3>Rechnung ${i.no}</h3><p>Rechnungsdatum: ${new Date(i.date+'T12:00').toLocaleDateString('de-DE')}</p><p><b>Rechnung an:</b><br>${i.customer}<br>${(i.address||'').replace(/\n/g,'<br>')}</p><h3>Positionen</h3>${itemHtml}${ship}<div class='total'>Gesamt: ${eur(i.total)}</div><p><b>Zahlungsmöglichkeiten</b><br>${COMPANY.bank}<br>IBAN: ${COMPANY.iban}<br>PayPal: ${COMPANY.paypal}</p><p><b>Hinweis PayPal:</b><br>Wer mit PayPal zahlt, bitte per Freunde oder bei Warendienstleistung die Gebühren übernehmen.</p><p class='muted'>Steuernummer: ${COMPANY.tax}</p><p class='muted'>Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.</p>`}
function dashboard(){count.textContent=invoices.length;openTotal.textContent=eur(invoices.filter(i=>i.status==='Offen').reduce((a,b)=>a+b.total,0))}

date.value=new Date().toISOString().slice(0,10);addPosition();dashboard();
</script></body></html>
